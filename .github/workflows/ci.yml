name: Sajang CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest  # GitHub Actions의 기본 Ubuntu 환경 사용

    steps:
      # GitHub Repository의 코드 가져오기
      - name: Checkout Repository
        uses: actions/checkout@v4

      # JDK 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Gradle 캐시 설정 (빌드 속도 개선)
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # gradle build 전 데이터베이스 준비


      # Gradle 실행 권한 부여 (Linux 환경)
      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      # Gradle 빌드 & 테스트 실행
      - name: Build and Test with Gradle
        run: ./gradlew clean build --info
