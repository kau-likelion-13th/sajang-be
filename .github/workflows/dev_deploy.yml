name: Sajang Dev CI/CD

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop'
    # develop branch로 PR 요청 후 merge되면 작동

    steps:
      # ✅ 1️⃣ Repository 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ 2️⃣ JDK 17 설치 (temurin)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ✅ 3️⃣ Gradle 캐시 설정 (빌드 속도 향상)
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ✅ 4️⃣ Gradle 실행 권한 부여
      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      # ✅ 5️⃣ Gradle 빌드 & 테스트
      - name: Build and Test with Gradle
        run: ./gradlew clean build -x test

  deploy:
    name: Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: build  # 🔥 Build가 성공한 후에만 배포

    steps:
      # ✅ 6️⃣ Repository 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ 7️⃣ 현재 시간 가져오기 (버전 라벨링)
      - name: Get current time
        uses: josStorer/get-current-time@v2
        id: current-time
        with:
          format: 'YYYY-MM-DDTHH:mm:ss'
          utcOffset: '+09:00'

      - name: Show current time
        run: echo "${{ steps.current-time.outputs.formattedTime }}"

      # ✅ 8️⃣ EB 배포 패키지 생성
      - name: Generate deployment package
        run: |
          mkdir -p deploy
          cp build/libs/*boot.jar deploy/application.jar  # bootJar 사용
          cp Procfile deploy/Procfile
          cp -r .ebextensions deploy/.ebextensions
          zip -r deploy/deploy.zip deploy/

      # ✅ 9️⃣ Elastic Beanstalk에 배포
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v20
        with:
          aws_access_key: ${{ secrets.AWS_ACTION_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_ACTION_SECRET_ACCESS_KEY }}
          application_name: 'sajang-dev'         # 🔥 EB 애플리케이션 이름
          environment_name: 'Sajang-dev-env'    # 🔥 EB 환경 이름
          version_label: github-action-${{ steps.current-time.outputs.formattedTime }}
          region: 'ap-northeast-2'              # ✅ 서울 리전
          deployment_package: 'deploy/deploy.zip'
          wait_for_deployment: false
# 왜 안만들어져